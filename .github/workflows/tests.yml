name: tests

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install CPU dependencies
        run: |
          pip install --index-url https://download.pytorch.org/whl/cpu torch==2.4.1
          pip install numpy scipy tensorboard tqdm ruff pytest
      - name: Lint and format check
        run: ruff check src scripts tests && ruff format --check src scripts tests
      - name: Reference, config, runtime and end-to-end tests
        run: python -m pytest -q tests
