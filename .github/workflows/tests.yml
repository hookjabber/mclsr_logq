name: tests

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install CPU dependencies
        run: |
          pip install --index-url https://download.pytorch.org/whl/cpu torch==2.4.1
          pip install numpy scipy tensorboard tqdm
      - name: Loss reference tests
        run: python tests/test_logq_losses.py
      - name: Metric reference tests
        run: python tests/test_metrics.py
      - name: Config validation
        run: python tests/test_configs.py
      - name: Runtime smoke tests
        run: python tests/test_runtime.py
