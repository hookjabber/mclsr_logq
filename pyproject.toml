[build-system]
requires = ["setuptools>=64.0"]
build-backend = "setuptools.build_meta"

[project]
name = "irec"
description = "Config-driven PyTorch framework for sequential and graph-based recommendation, reduced to the MCLSR logQ study"
version = "1.0"
requires-python = ">=3.12"

dependencies = [
    "numpy==1.26.*",
    "torch==2.4.*",
    "tqdm==4.66.*",
    "scipy==1.14.*",
    "pandas==2.2.*",
    "polars==1.27.*",
    "matplotlib==3.9.*",
    "tensorboard==2.19.*",
    "wandb==0.19.*",
    "jupyterlab==4.4.*",
    "ipykernel==6.29.*",
    "notebook==7.4.*",
]

[project.optional-dependencies]
dev = [
    "pytest==8.*",
    "mypy==1.11.*",
    "ruff==0.11.*",
    "types-tqdm==4.67.*",
    "scipy-stubs==1.15.*",
]

[project.scripts]
train="irec.train:main"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.format]
quote-style = "single"

[tool.ruff.lint]
select = ["E", "F"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401", "F403"]
"tests/*.py" = ["E402"]
